name: CI & Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "[0-9]+.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux CLI
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make g++ git

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_EDITOR=OFF -DBUILD_CLI=ON

      - name: Build Project
        run: |
          cmake --build build --config Release -j$(nproc) || (echo "=== BUILD FAILED, RUNNING VERBOSE BUILD ===" && cmake --build build --verbose && exit 1)

      - name: Test CLI
        run: ./build/nav_cli --help

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: navstudio-linux-cli
          path: |
            build/nav_cli

  build-windows:
    name: Build Windows (NavStudio & CLI)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake (Win32)
        run: cmake -B build -A Win32 -DBUILD_EDITOR=ON -DBUILD_CLI=ON

      - name: Build Project
        shell: pwsh
        run: |
          $output = cmake --build build --config Release 2>&1
          $output | Out-File -FilePath build.log -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            $errs = $output | Select-String "error C|fatal error|FAILED" -Context 1,1
            foreach ($e in $errs) {
              $clean = $e.ToString().Replace("`r", "").Replace("`n", " ")
              Write-Host "::error title=MSVC Error::$clean"
            }
            Get-Content build.log -Tail 100 | Write-Host
            exit 1
          }

      - name: Test CLI
        run: .\build\Release\nav_cli.exe --help

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: navstudio-windows-x86
          path: |
            build/Release/nav_editor.exe
            build/Release/nav_cli.exe

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/1.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: navstudio-windows-x86
          path: release_pkg/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: navstudio-linux-cli
          path: release_pkg/

      - name: Prepare Package
        run: |
          cp README.md release_pkg/
          cd release_pkg && zip -r ../NavStudio_release.zip .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NavStudio_release.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
